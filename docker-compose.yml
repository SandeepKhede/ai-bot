version: '3.9'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: wabot
      POSTGRES_USER: wabot
      POSTGRES_PASSWORD: wabot
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
